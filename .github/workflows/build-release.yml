name: Build, verify, and release chroot-mysql

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub Release after all checks pass
        required: false
        type: boolean
        default: false
      tag:
        description: Existing tag to publish when release is selected
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Debian 12 rootfs and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify installation layout safety
        run: bash tests/install-layout-test.sh
      - name: Check installation scripts
        run: bash -n install.sh uninstall.sh install-layout.sh scripts/package.sh
      - name: Validate manual release input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          test -n '${{ inputs.tag }}'
          case '${{ inputs.tag }}' in v*) ;; *) echo 'manual release tag must start with v' >&2; exit 1;; esac
      - name: Reuse the pinned MySQL and XtraBackup rootfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=chroot-mysql-v0.1.16-linux-amd64
          mkdir -p base-bundle build
          gh release download v0.1.16 --repo "$GITHUB_REPOSITORY" --dir base-bundle \
            --pattern "$base.tar.gz" --pattern SHA256SUMS
          (cd base-bundle && sha256sum --check SHA256SUMS)
          sudo tar --numeric-owner --strip-components=1 -xzf "base-bundle/$base.tar.gz" \
            -C build "$base/rootfs"
      - name: Verify rootfs
        run: sudo bash tests/verify-rootfs.sh build/rootfs
      - name: Create offline package
        run: sudo bash scripts/package.sh "${{ inputs.tag || github.ref_name }}"
      - name: Verify package integrity
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          tar -tzf dist/chroot-mysql-*-linux-amd64.tar.gz | grep -E '/rootfs/usr/sbin/mysqld$'
          tar -tzf dist/chroot-mysql-*-linux-amd64.tar.gz | grep -E '/rootfs/usr/bin/xtrabackup$'
          tar -tzf dist/chroot-mysql-*-linux-amd64.tar.gz | grep -E '/bin/chroot-mysql-pxb$'
      - uses: actions/upload-artifact@v4
        with:
          name: chroot-mysql-release
          path: dist/
          if-no-files-found: error

  verify-ubuntu24:
    name: Verify on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set production permissions on disposable test directories
        run: |
          sudo chown root:root /opt /home
          sudo chmod go-w /opt /home
          if command -v setfacl >/dev/null; then sudo setfacl -k /opt /home; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: chroot-mysql-release
          path: dist
      - name: Validate required host capabilities
        run: |
          test "$(uname -m)" = x86_64
          command -v systemctl
          sudo -n true
      - name: Verify package checksum
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Run real service smoke test
        run: sudo -E bash tests/smoke-test.sh "$(find dist -name 'chroot-mysql-*-linux-amd64.tar.gz' -print -quit)" "$GITHUB_RUN_ID"
      - name: Verify home installation, reinstall and uninstall
        env:
          CHROOT_TEST_LAYOUT: home
        run: sudo -E bash tests/smoke-test.sh "$(find dist -name 'chroot-mysql-*-linux-amd64.tar.gz' -print -quit)" "$GITHUB_RUN_ID"

  verify-centos7-kernel310:
    name: Verify on self-hosted CentOS 7 / kernel 3.10
    # Temporarily disabled while the dedicated CentOS 7 runner is offline.
    if: ${{ false }}
    needs: build
    runs-on: [self-hosted, linux, x64, centos7-kernel310-mysql]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: chroot-mysql-release
          path: dist
      - name: Validate required host capabilities
        run: |
          test "$(uname -m)" = x86_64
          [[ "$(uname -r)" == 3.10.* ]]
          command -v systemctl
          sudo -n true
      - name: Verify package checksum
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Run real service smoke test
        run: sudo -E bash tests/smoke-test.sh "$(find dist -name 'chroot-mysql-*-linux-amd64.tar.gz' -print -quit)" "$GITHUB_RUN_ID"

  release:
    name: Create GitHub Release
    needs: [verify-ubuntu24]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chroot-mysql-release
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/chroot-mysql-*-linux-amd64.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/chroot-mysql-*-linux-amd64.tar.gz dist/SHA256SUMS \
              --title "chroot-mysql $RELEASE_TAG" --generate-notes
          fi

  cleanup-artifacts:
    name: Remove artifacts from non-release or failed runs
    needs: [build, verify-ubuntu24, release]
    if: >-
      ${{
        always() &&
        (
          needs.build.result != 'success' ||
          needs.verify-ubuntu24.result != 'success' ||
          needs.release.result == 'failure' ||
          needs.release.result == 'cancelled' ||
          !(
            startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts created by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' |
            while read -r artifact_id; do
              test -n "$artifact_id" || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              echo "Deleted artifact $artifact_id from run $GITHUB_RUN_ID"
            done
